<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 56" fill="none" role="img" aria-label="Red Beacon Asset Management">
  <!-- Beacon mark -->
  <g transform="translate(4, 4)">
    <!-- Light rays -->
    <line x1="20" y1="9"  x2="20" y2="1"  stroke="#e05a8a" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="20" y1="9"  x2="11" y2="2"  stroke="#e05a8a" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="20" y1="9"  x2="29" y2="2"  stroke="#e05a8a" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Lantern -->
    <circle cx="20" cy="14" r="5"   fill="#e05a8a"/>
    <circle cx="20" cy="14" r="2.5" fill="#0a2540"/>
    <!-- Platform -->
    <rect x="13" y="18.5" width="14" height="2.5" rx="1.25" fill="#e05a8a"/>
    <!-- Tower body (tapered) -->
    <path d="M17 21 L14 40 L26 40 L23 21 Z" fill="#e05a8a"/>
    <!-- Base -->
    <rect x="10" y="40" width="20" height="4" rx="2" fill="#e05a8a" opacity="0.75"/>
  </g>

  <!-- Wordmark -->
  <text
    x="58" y="26"
    font-family="Georgia,'Times New Roman',serif"
    font-size="20"
    font-weight="700"
    fill="#0a2540"
  >Red Beacon</text>
  <text
    x="59" y="40"
    font-family="'Helvetica Neue',Arial,sans-serif"
    font-size="7.5"
    font-weight="500"
    letter-spacing="2.8"
    fill="#e05a8a"
  >ASSET MANAGEMENT</text>
</svg>
